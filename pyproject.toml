[project]
name = "pyheritage"
version = "0.1.0"
description = "Pydantic models for the CIDOC Conceptual Reference Model (CRM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "edtf>=5.0.0",
    "pydantic>=2.12.4",
    "pygeoif>=1.6.0",
]

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "flake8>=7.3.0",
    "flake8-absolute-import>=1.0.0.2",
    "flake8-annotations>=3.2.0",
    "flake8-bugbear>=25.10.21",
    "flake8-comprehensions>=3.17.0",
    "flake8-pydantic>=0.4.0",
    "flake8-simplify>=0.22.0",
    "isort>=7.0.0",
    "pre-commit>=4.4.0",
    "pylint>=4.0.3",
    "pylint-pydantic>=0.4.1",
    "pytest>=9.0.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
filterwarnings = [
    "ignore",
]
addopts = [
    "-v",
    "--cov=pyheritage",
]

[tool.coverage.run]
#source = ["pyheritage"]       # какой пакет измерять
omit = [
    "tests/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
